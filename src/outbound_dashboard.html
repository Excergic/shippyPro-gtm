<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShippyPro · Campaign audit</title><style>
:root{--bg:#f4f6f9;--ink:#172238;--muted:#617087;--line:#dce3ed;--blue:#2159cf;--soft:#e9effe;--warn:#fff4da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}header{padding:25px 30px;background:#14223d;color:white}header p{color:#c5d3eb;margin:5px 0}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}a{color:var(--blue);overflow-wrap:anywhere}header a{color:#ccdbff}.badge{display:inline-block;border-radius:5px;background:var(--soft);padding:3px 8px;font-size:12px;color:#24498d}.badge.warn{background:var(--warn);color:#755600}.banner{padding:12px 30px;background:#e9effe;color:#294a83}.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin:20px 30px}.metric{background:white;border:1px solid var(--line);padding:15px;border-radius:10px}.metric strong{display:block;font-size:26px}.metric span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:325px minmax(0,1fr);gap:20px;margin:0 30px 30px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:18px}aside{align-self:start;position:sticky;top:15px;max-height:83vh;display:flex;flex-direction:column}.search{padding:10px;width:100%;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}select{padding:8px;border:1px solid var(--line);border-radius:5px;background:white}#list{overflow:auto;margin-top:8px}.contact{width:100%;border:0;border-bottom:1px solid var(--line);background:white;text-align:left;padding:13px 8px;cursor:pointer}.contact.active{background:var(--soft);border-left:3px solid var(--blue)}.contact strong,.contact span{display:block}.contact small{color:var(--muted)}.contact span{font-size:13px}.muted{color:var(--muted)}.stack{display:grid;gap:16px}.fact{padding:12px;background:#f7f9fc;border-radius:7px;margin:10px 0}.fact small{display:block;color:var(--muted);margin-bottom:4px}.flags{background:var(--warn);padding:12px 16px;border-radius:6px}.flags ul{padding-left:18px;margin:5px 0}.sources a{display:block;font-size:12px;margin:5px 0}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:15px 0}button{font:inherit;border-radius:6px;border:1px solid var(--line);padding:8px 12px;background:white;color:var(--ink);cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:white}button:disabled{opacity:.45;cursor:default}.step{padding:15px 0;border-top:1px solid var(--line)}.step h3{display:flex;gap:10px;align-items:center}.subject,.body,.notes{display:block;width:100%;font:inherit;color:var(--ink);padding:11px;border:1px solid var(--line);border-radius:6px;background:white}.subject{font-weight:600;margin:9px 0}.body{resize:vertical;min-height:245px;line-height:1.65}.notes{min-height:85px;margin:8px 0}.timeline{max-height:220px;overflow:auto}.timeline p{font-size:12px;border-left:2px solid var(--line);padding-left:10px}nav{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}#feedback{color:#224db3}code{font-size:12px;background:#dce5f7;padding:2px 5px;overflow-wrap:anywhere}.hide{display:none}@media(max-width:950px){.metrics{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:260px minmax(0,1fr);margin:0 15px 20px;gap:12px}.metrics{margin:15px}.panel{padding:13px}}@media(max-width:650px){.layout{display:block}aside{position:static;max-height:300px;margin-bottom:15px}.metrics{grid-template-columns:repeat(3,1fr)}header,.banner{padding:16px}.body{min-height:290px}}
</style></head><body><header><span class="badge">Independent ghost audit</span><h1>ShippyPro campaign workbench</h1><p>Real prospects and public research. Proposed copy. No sender identity, scheduled delivery or sending connection.</p><nav><a href="campaign_contacts_50.csv">Baseline 50-contact CSV</a><a href="campaign_messages_200.csv">Baseline 200-message CSV</a><a href="research_50.json">Research with sources</a></nav></header><div id="connection" class="banner"></div><div class="toolbar" style="margin:12px 30px"><button id="backup">Export review backup</button><button id="current_csv">Export current messages CSV</button><span id="save_status" class="muted">Review is for this independent audit only.</span></div><section id="metrics" class="metrics"></section><div class="layout"><aside class="panel"><input id="search" class="search" aria-label="Find a contact" placeholder="Search company, person or role"><select id="filter" aria-label="Filter contacts"><option value="all">All 50 contacts</option><option value="unreviewed">Awaiting audit review</option><option value="reviewed">Reviewed for audit</option><option value="flags">Has research or email flags</option><option value="no_email">Missing email</option></select><div id="list"></div></aside><main id="detail" class="stack"></main></div><script id="initial" type="application/json">__CAMPAIGN_DATA__</script><script>
let data=JSON.parse(document.getElementById('initial').textContent),selected=data.contacts[0]?.id,live=location.protocol!=='file:';
const storageKey='shippypro-ghost-audit-v1',memory={campaign_id:data.campaign.campaign_id,contacts:{},events:[],updated_at:null};let canSave=true;
try{Object.assign(memory,JSON.parse(localStorage.getItem(storageKey)||'{}'));localStorage.setItem(storageKey,JSON.stringify(memory))}catch{canSave=false}
function applySaved(){for(const c of data.contacts){const saved=memory.contacts[c.id];if(!saved)continue;if(saved.review_status)c.review_status=saved.review_status;if(saved.note!==undefined)c.note=saved.note;for(const m of c.messages){if(saved.review_status)m.review_status=saved.review_status==='reviewed'?'reviewed':'draft';const x=saved.messages?.[m.id];if(x){if(x.base_hash!==m.content_hash&&x.base_hash!==m.saved_base_hash){c.review_status='needs_revision';continue}m.saved_base_hash=x.base_hash;m.subject=x.subject;m.body=x.body;m.review_status=x.review_status;m.revision=x.revision}}for(const e of memory.events.filter(e=>e.contact_id===c.id))if(!c.timeline.some(x=>x.id===e.id))c.timeline.push(e)}data.summary.reviewed_contacts=data.contacts.filter(c=>c.review_status==='reviewed').length}
applySaved();
const E=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function link(url,title){const a=E('a',title);try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return E('span',title);a.href=u.href;a.target='_blank';a.rel='noreferrer';return a}catch{return E('span',title)}}
function redraw(){const s=data.summary,m=document.getElementById('metrics');m.replaceChildren();for(const [key,label]of [['contacts','Contacts researched'],['draft_messages','Proposed messages'],['reviewed_contacts','Audit reviews complete'],['work_emails','Work emails available'],['sent','Messages sent'],['replies','Replies received'],['demos_booked','Demos booked']]){const c=E('div',undefined,'metric');c.append(E('strong',s[key]),E('span',label));m.append(c)}drawList();drawDetail()}
function drawList(){const list=document.getElementById('list');list.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;for(const c of data.contacts){if(![c.company,c.name,c.title].join(' ').toLowerCase().includes(q))continue;if(f==='unreviewed'&&c.review_status==='reviewed'||f==='reviewed'&&c.review_status!=='reviewed'||f==='flags'&&!c.research.review_flags.length||f==='no_email'&&c.email)continue;const b=E('button',undefined,'contact'+(selected===c.id?' active':''));b.append(E('strong',`${c.rank}. ${c.company}`),E('span',c.name),E('small',`${c.review_status} · ${c.email?'email found':'email gap'}`));b.onclick=()=>{selected=c.id;drawList();drawDetail()};list.append(b)}}
function fact(container,label,text){const x=E('div',undefined,'fact');x.append(E('small',label),E('div',text));container.append(x)}
function drawDetail(){const c=data.contacts.find(c=>c.id===selected),d=document.getElementById('detail');d.replaceChildren();if(!c)return;const r=c.research,profile=E('section',undefined,'panel');profile.append(E('h2',c.name+' · '+c.company),E('div',c.title,'muted'));const nav=E('nav');nav.append(link(c.linkedin,'Professional profile'));if(c.email)nav.append(E('span',c.email));else nav.append(E('span','Email unresolved','badge warn'));profile.append(nav,E('div',r.email_status,'muted'));fact(profile,'Observed company event · '+r.event_date,r.observed_company_event);fact(profile,'Public professional research · '+r.research_status,r.person_public_fact);fact(profile,'Role-based hypothesis — not a verified internal problem',r.persona_hypothesis+' '+r.need_hypothesis);fact(profile,'Suggested diagnostic and measure',r.suggested_diagnostic+'; proposed measure: '+r.proposed_measure);const sources=E('div',undefined,'sources');sources.append(link(r.company_source,'Company-event evidence'),link(r.product_capability_source,'ShippyPro capability evidence'));for(const s of r.person_sources)sources.append(link(s.url,s.title));profile.append(sources);if(r.review_flags.length){const fl=E('div',undefined,'flags');fl.append(E('strong','Before operational use'));const ul=E('ul');for(const x of r.review_flags)ul.append(E('li',x));fl.append(ul);profile.append(fl)}d.append(profile);
const messages=E('section',undefined,'panel');messages.append(E('h2','Proposed four-touch sequence'),E('p','Offsets are business days after a hypothetical activation. No activation date or deliveries exist. Review is for the audit only.','muted'));
for(const m of c.messages){const box=E('div',undefined,'step');box.append(E('h3',`Touch ${m.step} · proposed day ${m.day_offset}`),E('span',m.review_status,'badge'));const sub=E('input',undefined,'subject');sub.value=m.subject;sub.setAttribute('aria-label',`Touch ${m.step} subject`);const body=E('textarea',undefined,'body');body.value=m.body;body.setAttribute('aria-label',`Touch ${m.step} message`);sub.readOnly=!live&&!canSave;body.readOnly=!live&&!canSave;const tb=E('div',undefined,'toolbar');const copy=E('button','Copy message');copy.onclick=async()=>{try{await navigator.clipboard.writeText(sub.value+'\n\n'+body.value);copy.textContent='Copied'}catch{body.select();copy.textContent='Select and copy'}};const save=E('button','Save draft');save.disabled=!live&&!canSave;save.onclick=()=>send({action:'edit_message',contact_id:c.id,message_id:m.id,subject:sub.value,body:body.value,revision:m.revision});tb.append(copy,save,E('small',`${m.body.split(/\s+/).length} words · revision ${m.revision}`,'muted'));box.append(sub,body,tb);messages.append(box)}d.append(messages);
const review=E('section',undefined,'panel');review.append(E('h2','Audit review and activity'));const tb=E('div',undefined,'toolbar');for(const [status,label]of [['reviewed','Mark reviewed for audit'],['needs_revision','Needs revision'],['unreviewed','Reset review']]){const b=E('button',label,status==='reviewed'?'primary':'');b.disabled=!live&&!canSave;b.onclick=()=>send({action:'review',contact_id:c.id,status});tb.append(b)}review.append(tb);const notes=E('textarea',undefined,'notes');notes.value=c.note;notes.readOnly=!live&&!canSave;notes.placeholder='Audit notes: role corrections, message feedback, routing questions…';notes.setAttribute('aria-label','Audit notes');const save=E('button','Save note');save.disabled=!live&&!canSave;save.onclick=()=>send({action:'note',contact_id:c.id,note:notes.value});review.append(notes,save,E('p','No sending or simulated reply controls are available. No contact has been contacted.','muted'));const tl=E('div',undefined,'timeline');for(const e of [...c.timeline].reverse())tl.append(E('p',new Date(e.created_at).toLocaleString()+' · '+e.type.replaceAll('_',' ')+' · '+JSON.stringify(e.payload)));review.append(tl);d.append(review)}
async function send(op){try{if(live){const res=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...op,event_id:crypto.randomUUID()})});const payload=await res.json();if(!res.ok)throw Error(payload.error);data=payload}else{if(!canSave)throw Error('Browser storage is unavailable; use the Python tracker for durable changes.');const c=data.contacts.find(c=>c.id===op.contact_id),saved=memory.contacts[c.id]||(memory.contacts[c.id]={messages:{}});if(op.action==='review'){saved.review_status=op.status;c.review_status=op.status;for(const m of c.messages){m.review_status=op.status==='reviewed'?'reviewed':'draft';if(saved.messages[m.id])saved.messages[m.id].review_status=m.review_status}}else if(op.action==='note'){saved.note=op.note;c.note=op.note}else if(op.action==='edit_message'){const m=c.messages.find(m=>m.id===op.message_id);if(!op.subject.trim()||!op.body.trim())throw Error('Subject and message are required');saved.messages[m.id]={subject:op.subject,body:op.body,base_hash:m.saved_base_hash||m.content_hash,base_revision:saved.messages[m.id]?.base_revision||m.revision,review_status:'draft',revision:m.revision+1};Object.assign(m,saved.messages[m.id]);saved.review_status='unreviewed';c.review_status='unreviewed'}else throw Error('Only audit actions are allowed');memory.updated_at=new Date().toISOString();const e={id:crypto.randomUUID(),contact_id:c.id,type:'local_'+op.action,created_at:memory.updated_at,payload:{action:op.action,status:op.status||'saved locally'}};memory.events.push(e);localStorage.setItem(storageKey,JSON.stringify(memory));applySaved();document.getElementById('save_status').textContent='Saved in this browser. Export a review backup to keep a portable copy.'}redraw()}catch(e){alert(e.message)}}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('current_csv').onclick=()=>{const rows=[['company','contact','email','step','proposed_business_day_offset','subject','body','review_status','mode']];for(const c of data.contacts)for(const m of c.messages)rows.push([c.company,c.name,c.email,m.step,m.day_offset,m.subject,m.body,m.review_status,'ghost_audit']);const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('shippypro-current-messages.csv',csv,'text/csv')};
document.getElementById('backup').onclick=()=>download('shippypro-review-backup.json',JSON.stringify(memory,null,2),'application/json');
document.getElementById('search').oninput=drawList;document.getElementById('filter').onchange=drawList;
(async()=>{const banner=document.getElementById('connection');if(live){try{const res=await fetch('/api/campaign');if(!res.ok)throw Error('Tracker unavailable');data=await res.json();banner.textContent='Local tracker connected. Draft edits, review decisions and notes persist in SQLite. No messages can be sent.'}catch{live=false;banner.textContent='Browser-local audit tracker. Edits and notes stay in this browser; export a review backup for portability.';applySaved()}}else{banner.textContent=canSave?'Browser-local audit tracker. Edits, notes and review statuses are saved on this device. Export a review backup to preserve or import them. No messages can be sent.':'Browser storage is unavailable. This snapshot is read-only; the Python tracker remains available.'}redraw()})();
</script></body></html>
